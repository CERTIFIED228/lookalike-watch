name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build
      - run: pytest
      - run: python -m build
      - name: zip the extension
        working-directory: extension
        run: zip -r ../dist/lookalike-watch-extension.zip . -x "test/*" "scripts/*" package.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **Browser extension:** download \`lookalike-watch-extension.zip\`, unzip it, then in Chrome or Edge open the extensions page, turn on Developer mode and choose **Load unpacked**.

          **Scanner:** \`pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/lookalike_watch-${GITHUB_REF_NAME#v}-py3-none-any.whl\`

          Step-by-step instructions are in the [README](https://github.com/${GITHUB_REPOSITORY}#download-and-try-it).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "lookalike-watch $GITHUB_REF_NAME" --notes-file notes.md
